[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rosame"
version = "0.2.0"
description = "Neuro-symbolic learning of lifted STRIPS action models from (probabilistic) state traces"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
authors = [
  { name = "Kai Xi" },
  { name = "Stephen Gould" },
  { name = "Sylvie Thiébaux" },
]
keywords = ["action model learning", "planning", "PDDL", "neuro-symbolic", "pytorch"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0", "planning-structs>=0.1.0,<0.2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/xikaioliver/ROSAME"
Issues = "https://github.com/xikaioliver/ROSAME/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rosame"]

[tool.hatch.build.targets.sdist]
include = ["src/rosame", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end learning runs (a few seconds each)"]
